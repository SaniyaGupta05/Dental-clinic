name: CI - Kumar Dental Clinic Platform

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Lint, Type-Check & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio

      - name: Run Pytest Test Suite
        run: |
          cd backend
          pytest -v

  dashboard-build:
    name: Web Dashboard Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/clinic-dashboard/package-lock.json

      - name: Install Web Dashboard Dependencies
        run: |
          cd apps/clinic-dashboard
          npm ci

      - name: Build Web Dashboard
        run: |
          cd apps/clinic-dashboard
          npm run build

  mobile-check:
    name: Patient Mobile Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/patient-mobile/package.json

      - name: Install Mobile Dependencies
        run: |
          cd apps/patient-mobile
          npm install

      - name: Mobile TypeScript Verification
        run: |
          cd apps/patient-mobile
          npx tsc --noEmit
